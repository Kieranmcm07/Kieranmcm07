name: Refresh GitHub stats card

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-stats.yml
      - scripts/update_stats.py
      - tests/test_update_stats.py
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-stats-card
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Check stats generation
        run: python3 -B -m unittest discover -s tests

      - name: Generate cards from GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 -B scripts/update_stats.py --username "$PROFILE_USERNAME"

      - name: Commit refreshed cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats-dark.svg assets/github-stats-light.svg

          if git diff --cached --quiet; then
            echo "Stats cards are already up to date."
            exit 0
          fi

          git commit -m "Refresh GitHub stats card [skip ci]"
          git push
